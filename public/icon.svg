<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Notebook Cover -->
  <rect x="10" y="8" width="44" height="48" rx="8" fill="url(#cover)"/>

  <!-- Spiral -->
  <rect x="15" y="12" width="3" height="40" rx="1.5" fill="#FFFFFF" opacity="0.95"/>

  <circle cx="16.5" cy="18" r="1.3" fill="#4F46E5"/>
  <circle cx="16.5" cy="26" r="1.3" fill="#4F46E5"/>
  <circle cx="16.5" cy="34" r="1.3" fill="#4F46E5"/>
  <circle cx="16.5" cy="42" r="1.3" fill="#4F46E5"/>

  <!-- Pages -->
  <line x1="24" y1="22" x2="46" y2="22"
        stroke="white" stroke-width="3" stroke-linecap="round"/>

  <line x1="24" y1="31" x2="42" y2="31"
        stroke="white" stroke-width="3" stroke-linecap="round"/>

  <line x1="24" y1="40" x2="46" y2="40"
        stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
