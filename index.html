<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook</title>
<script>
(function () {
    try {
        const stored = localStorage.getItem('notebook_theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
    } catch (e) {
        document.documentElement.dataset.theme = 'light';
    }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js">
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@400;600;700&display=swap');

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-app: #F5F4F0;
    --bg-paper: #FFFFFF;
    --bg-sidebar: #EFEDE7;
    --ink: #20242A;
    --ink-soft: #5B6169;
    --accent: #16324F;
    --accent-soft: #3D5A78;
    --gold: #AD8A4E;
    --border: #DEDAD0;
    --danger: #A23B2E;
    --bg: var(--bg-app);
    --sidebar-bg: var(--bg-sidebar);
    --surface: var(--bg-paper);
    --primary: var(--accent);
    --primary-hover: var(--accent-soft);
    --primary-light: var(--bg-paper);
    --text: var(--ink);
    --text-secondary: var(--ink-soft);
    --text-muted: #858177;
    --border-light: var(--border);
    --hover: #E6E2D9;
    --danger-hover: #7F2D24;
    --shadow-sm: 0 1px 2px rgba(32, 36, 42, 0.06);
    --shadow: 0 12px 28px rgba(32, 36, 42, 0.10);
    --radius: 10px;
    --radius-sm: 6px;
    --sidebar-width: 260px;
    --header-height: 56px;
    --toolbar-height: 42px;
    --font: 'Inter', sans-serif;
    --mono-font: 'JetBrains Mono', monospace;
    --serif-font: 'Source Serif 4', serif;
}

html[data-theme="dark"] {
    --bg-app: #14171C;
    --bg-paper: #1B1F26;
    --bg-sidebar: #101317;
    --ink: #E7E5DE;
    --ink-soft: #9BA1AA;
    --text-muted: #6E747C;
    --accent: #7FA8CC;
    --accent-soft: #9CC0E0;
    --gold: #D4AF6A;
    --border: #2A2F37;
    --danger: #E0796A;
    --danger-hover: #F0968A;
    --hover: #22262E;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
}

html {
    color-scheme: light;
}

html[data-theme="dark"] {
    color-scheme: dark;
}

::selection {
    background: rgba(173, 138, 78, 0.24);
    color: var(--ink);
}

html[data-theme="dark"] ::selection {
    background: rgba(127, 168, 204, 0.35);
    color: var(--ink);
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

#app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* Header */
#header {
    height: var(--header-height);
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-app);
    flex-shrink: 0;
    gap: 12px;
}

#header h1 {
    font-family: var(--serif-font);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
}

#theme-toggle {
    display: none;
}

#menu-toggle {
    display: block;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
}

#menu-toggle:hover,
#theme-toggle:hover {
    background: var(--hover);
    color: var(--accent);
}

#menu-toggle svg,
#theme-toggle svg {
    display: block;
}

#header-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-left: auto;
    white-space: nowrap;
}

#theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
}

/* Main Layout */
#main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
}

/* Sidebar */
#sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
}

#sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

#add-note {
    width: 100%;
    padding: 10px 16px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
    font-family: var(--font);
}

#add-note:hover {
    background: var(--accent-soft);
}

#add-note svg {
    flex-shrink: 0;
}

#sort-select {
    width: 100%;
    margin-top: 8px;
    padding: 7px 10px;
    background: var(--bg-paper);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    outline: none;
    appearance: auto;
}

#sort-select:focus {
    border-color: var(--gold);
}

#notes-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.note-item {
    padding: 12px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.1s;
    position: relative;
    border-left: 3px solid transparent;
}

.note-item:hover {
    background: var(--hover);
}

.note-item.active {
    background: var(--bg-paper);
    border-left-color: var(--gold);
    box-shadow: var(--shadow-sm);
}

.note-item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
}

.note-item-preview {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.note-item-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
}

.note-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
}

.note-item:hover .note-delete {
    opacity: 1;
}

.note-delete:hover {
    color: var(--danger);
    background: rgba(162, 59, 46, 0.10);
}

html[data-theme="dark"] .note-delete:hover {
    background: rgba(224, 121, 106, 0.14);
}

.note-delete svg {
    display: block;
}

/* Editor Area */
#editor {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-paper);
}

/* Empty State */
#empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px;
    text-align: center;
}

#empty-state svg {
    margin-bottom: 20px;
    opacity: 0.3;
    color: var(--gold);
}

#empty-state h2 {
    font-family: var(--serif-font);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
}

#empty-state p {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 320px;
}

/* Note Content */
#note-content {
    display: none;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-rows: auto auto auto minmax(0, 1fr);
    height: 100%;
    min-height: 0;
    overflow: hidden;
}

#note-content.visible {
    display: grid;
}

#note-title {
    padding: 16px 24px 8px;
    font-size: 22px;
    font-weight: 600;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--serif-font);
    width: 100%;
    flex-shrink: 0;
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
}

#note-title::placeholder {
    color: var(--text-muted);
    opacity: 1;
}

/* Toolbar */
#toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 24px;
    flex-shrink: 0;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border-light);
    border-top: 1px solid var(--border-light);
    background: var(--bg-paper);
    grid-column: 1 / -1;
    grid-row: 2;
}

.toolbar-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 30px;
    border: 1px solid var(--border);
    background: var(--bg-sidebar);
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 14px;
    font-family: var(--font);
    transition: all 0.12s;
    position: relative;
}

.toolbar-btn:hover {
    background: var(--border);
    color: var(--accent);
    border-color: var(--accent);
}

.toolbar-btn:active {
    background: #D6D0C4;
}

html[data-theme="dark"] .toolbar-btn:active {
    background: var(--hover);
}

.toolbar-btn.bold-btn { font-weight: 700; font-size: 15px; }
.toolbar-btn.italic-btn { font-style: italic; font-size: 15px; }
.toolbar-btn.strike-btn { text-decoration: line-through; font-size: 14px; }
.toolbar-btn.code-btn { font-family: var(--mono-font); font-size: 13px; }

.toolbar-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 0 3px;
    flex-shrink: 0;
}

#image-upload,
#open-md-input {
    display: none;
}

#drawing-panel {
    display: none;
    padding: 10px 24px 12px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-sidebar);
    flex-shrink: 0;
    grid-column: 1 / -1;
    grid-row: 3;
}

#drawing-panel.open {
    display: block;
}

#drawing-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.draw-field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
}

.draw-field input[type="color"] {
    width: 30px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    padding: 2px;
    cursor: pointer;
}

.draw-field input[type="range"] {
    width: 92px;
}

.action-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
}

#drawing-canvas-wrap {
    height: 220px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-paper);
    overflow: hidden;
    touch-action: none;
}

#drawing-canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg-paper);
    cursor: crosshair;
    touch-action: none;
}

/* Editor Tabs (mobile only) */
#editor-tabs {
    display: none;
    padding: 10px 16px;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg-paper);
}

.tab-btn {
    min-height: 34px;
    padding: 7px 14px;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    font-family: var(--font);
    position: relative;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
}

.tab-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--bg-paper);
}

.tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
}

.tab-btn svg {
    flex-shrink: 0;
}

/* Editor Body */
#editor-body {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    grid-column: 1 / -1;
    grid-row: 4;
}

#write-pane {
    flex: 0 0 50%;
    min-width: 0;
    position: relative;
    overflow: hidden;
}

#preview-pane {
    flex: 0 0 50%;
    min-width: 0;
    position: relative;
    overflow: hidden;
    border-left: 1px solid var(--border);
}

#preview-pane-header {
    display: none;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-sidebar);
}

#markdown-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 16px 24px;
    border: none;
    outline: none;
    resize: none;
    font-size: 14px;
    line-height: 1.7;
    font-family: var(--mono-font);
    font-weight: 400;
    color: var(--ink);
    background: var(--bg-paper);
    overflow-y: auto;
}

#markdown-input::placeholder {
    color: var(--text-muted);
    opacity: 1;
}

#preview {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: 16px 24px;
    font-family: var(--serif-font);
    color: var(--ink);
    background: var(--bg-paper);
}

#preview h1, #preview h2, #preview h3, #preview h4 {
    margin-top: 1.2em;
    margin-bottom: 0.4em;
    font-family: var(--serif-font);
    font-weight: 700;
    line-height: 1.3;
    color: var(--accent);
}

#preview h1 {
    font-size: 1.6em;
    padding-bottom: 0.25em;
    border-bottom: 1px solid var(--border);
}
#preview h2 { font-size: 1.35em; }
#preview h3 { font-size: 1.15em; }

#preview p {
    margin-bottom: 1em;
    color: var(--ink);
}

#preview ul, #preview ol {
    margin-bottom: 1em;
    padding-left: 1.5em;
}

#preview li {
    margin-bottom: 0.25em;
}

#preview code {
    background: var(--bg-sidebar);
    color: var(--ink);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
    font-size: 0.875em;
    font-family: var(--mono-font);
}

#preview pre {
    background: #1E232B;
    color: #EAEAEA;
    padding: 14px;
    border-radius: var(--radius);
    overflow-x: auto;
    margin-bottom: 1em;
    border: 1px solid #1E232B;
}

html[data-theme="dark"] #preview pre {
    background: #262B33;
    color: var(--ink);
    border-color: var(--border);
}

#preview pre code {
    background: transparent;
    color: #EAEAEA;
    padding: 0;
    font-size: 13px;
    line-height: 1.5;
}

html[data-theme="dark"] #preview pre code {
    color: var(--ink);
}

#preview blockquote {
    border-left: 3px solid var(--gold);
    padding: 6px 16px;
    margin-bottom: 1em;
    background: var(--bg-sidebar);
    color: var(--ink-soft);
    font-style: italic;
}

#preview table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1em;
}

#preview th, #preview td {
    padding: 8px 12px;
    border: 1px solid var(--border);
    text-align: left;
    font-size: 14px;
}

#preview th {
    background: var(--bg-sidebar);
    font-weight: 600;
}

#preview hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5em 0;
}

#preview a {
    color: var(--accent);
    text-decoration: none;
}

#preview a:hover {
    text-decoration: underline;
}

#preview img {
    max-width: 100%;
    border-radius: var(--radius-sm);
}

#preview-empty {
    color: var(--text-muted);
    font-style: italic;
}

/* Action Buttons */
#actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 24px 8px 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
    grid-column: 2;
    grid-row: 1;
}

.action-btn {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-paper);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    font-family: var(--font);
}

.action-btn:hover {
    background: var(--bg-paper);
    color: var(--accent);
    border-color: var(--accent);
}

#export-pdf {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
}

#export-pdf:hover {
    background: var(--accent-soft);
    border-color: var(--accent-soft);
    color: #FFFFFF;
}

.action-btn svg {
    flex-shrink: 0;
}

/* Sidebar Overlay for Mobile */
#sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32, 36, 42, 0.30);
    z-index: 10;
}

html[data-theme="dark"] #sidebar-overlay {
    background: rgba(0, 0, 0, 0.55);
}

#sidebar-overlay.open {
    display: block;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #C9C3B6;
    border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
}

html[data-theme="dark"] ::-webkit-scrollbar-thumb {
    background: #3A3F47;
}

html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
    background: var(--gold);
}

.notes-empty {
    padding: 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
}

/* Responsive: Mobile */
@media (max-width: 820px) {
    #menu-toggle {
        display: block;
    }

    #header {
        padding: 0 12px;
    }

    #header h1 {
        font-size: 16px;
    }

    #header-subtitle {
        font-size: 11px;
    }

    #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 20;
        height: 100vh;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: var(--shadow);
    }

    #sidebar.open {
        transform: translateX(0);
    }

    #sidebar-overlay.open {
        display: block;
    }

    #note-title {
        order: 1;
        padding: 14px 16px 6px;
        font-size: 18px;
    }

    #note-content {
        display: none;
        flex-direction: column;
        grid-template-columns: none;
        grid-template-rows: none;
    }

    #note-content.visible {
        display: flex;
    }

    #toolbar {
        order: 4;
        padding: 8px 12px;
        gap: 6px;
        justify-content: center;
        border-top: none;
    }

    #drawing-panel {
        order: 5;
        padding: 8px 16px 10px;
    }

    #drawing-canvas-wrap {
        height: 200px;
    }

    .toolbar-btn {
        width: 30px;
        height: 28px;
        font-size: 13px;
    }

    .toolbar-sep {
        margin: 0 1px;
    }

    #editor-tabs {
        display: flex;
        order: 3;
    }

    #editor-body {
        order: 6;
        position: relative;
        flex-direction: column;
    }

    #write-pane {
        position: absolute;
        inset: 0;
        width: 100%;
        display: block;
    }

    #write-pane.mobile-hidden {
        display: none;
    }

    #preview-pane {
        position: absolute;
        inset: 0;
        width: 100%;
        border-left: none;
        display: none;
    }

    #preview-pane.visible {
        display: block;
    }

    #markdown-input {
        padding: 12px 16px;
        font-size: 14px;
    }

    #preview {
        padding: 12px 16px;
    }

    #actions {
        order: 2;
        justify-content: flex-start;
        padding: 10px 16px;
        border-top: none;
        border-bottom: 1px solid var(--border);
        background: var(--bg-paper);
    }

    .action-btn {
        padding: 7px 12px;
        font-size: 12px;
    }

    #sidebar-header {
        padding: 12px;
    }

    #notes-list {
        padding: 6px;
    }

    .note-item {
        padding: 10px;
    }

    #empty-state h2 {
        font-size: 18px;
    }

    #empty-state p {
        font-size: 13px;
    }
}

@media (min-width: 821px) {
    #sidebar {
        transition: width 0.2s ease, min-width 0.2s ease;
    }

    #sidebar.collapsed {
        width: 0;
        min-width: 0;
        overflow: hidden;
        border-right: none;
    }

    #sidebar-overlay,
    #sidebar-overlay.open {
        display: none;
    }

    #preview-pane {
        display: block;
    }

    #write-pane {
        display: block;
    }

    #editor-tabs {
        display: none;
    }
}
</style>
</head>
<body>

<script>
(function () {
    'use strict';

    marked.setOptions({
        breaks: true,
        gfm: true
    });

    const STORAGE_KEY = 'notebook-data';
    const THEME_STORAGE_KEY = 'notebook_theme';

    let state = {
        notes: [],
        activeId: null,
        mobilePreview: false,
        sortBy: 'lastChange'
    };

    let saveTimeout = null;
    let isProgrammaticChange = false;
    let storageWarningShown = false;

    const $ = (s, p) => (p || document).querySelector(s);
    const $$ = (s, p) => (p || document).querySelectorAll(s);

    const sidebar = $('#sidebar');
    const notesList = $('#notes-list');
    const noteContent = $('#note-content');
    const emptyState = $('#empty-state');
    const noteTitle = $('#note-title');
    const mdInput = $('#markdown-input');
    const preview = $('#preview');
    const writePane = $('#write-pane');
    const previewPane = $('#preview-pane');
    const headerSub = $('#header-subtitle');
    const themeBtn = $('#theme-toggle');
    const overlay = $('#sidebar-overlay');
    const menuBtn = $('#menu-toggle');
    const toolbar = $('#toolbar');
    const imageUpload = $('#image-upload');
    const openMdBtn = $('#open-md');
    const openMdInput = $('#open-md-input');
    const drawingPanel = $('#drawing-panel');
    const drawingCanvas = $('#drawing-canvas');
    const drawColor = $('#draw-color');
    const drawSize = $('#draw-size');
    const drawEraser = $('#draw-eraser');
    const drawClear = $('#draw-clear');
    const drawInsert = $('#draw-insert');
    const drawClose = $('#draw-close');
    const mobileLayout = window.matchMedia('(max-width: 820px)');

    let drawingCtx = null;
    let drawingActive = false;
    let drawingPointerId = null;
    let drawingHasMarks = false;
    let drawingMode = 'pen';

    const themeIcons = {
        light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
        dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6.364 6.364 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>'
    };

    function currentTheme() {
        return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    }

    function setTheme(theme, persist) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = nextTheme;

        if (persist) {
            try {
                localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
            } catch (e) {}
        }

        updateThemeButton();
    }

    function updateThemeButton() {
        const activeTheme = currentTheme();
        const nextTheme = activeTheme === 'dark' ? 'light' : 'dark';
        themeBtn.innerHTML = themeIcons[activeTheme];
        themeBtn.setAttribute('aria-label', 'Switch to ' + nextTheme + ' theme');
        themeBtn.setAttribute('title', 'Switch to ' + nextTheme + ' theme');
    }

    function toggleTheme() {
        setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true);
    }

    function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function load() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.notes)) {
                    state.notes = parsed.notes;
                    state.activeId = parsed.activeId || null;
                    state.sortBy = parsed.sortBy || 'lastChange';
                    if (state.activeId && !state.notes.some(n => n.id === state.activeId)) {
                        state.activeId = state.notes.length > 0 ? state.notes[0].id : null;
                    }
                    if (migrateLegacyImageData()) {
                        save();
                    }
                    return;
                }
            }
        } catch (e) {}
        initDefaultNote();
    }

    function initDefaultNote() {
        const note = {
            id: uid(),
            title: 'Welcome to Notebook',
            content: '# Welcome!\n\nStart writing your notes here.\n\n## Features\n\n- **Bold**, *Italic*, ~~Strikethrough~~\n- Headings (H1, H2, H3)\n- Bullet & Numbered lists\n- Blockquotes & Code blocks\n- Links & Images\n- Export to PDF\n- Download as .md\n- Auto-saves locally\n\n> Happy note-taking!',
            attachments: {},
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        state.notes = [note];
        state.activeId = note.id;
        save();
    }

    function save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                notes: state.notes,
                activeId: state.activeId,
                sortBy: state.sortBy
            }));
            storageWarningShown = false;
        } catch (e) {
            if (!storageWarningShown) {
                storageWarningShown = true;
                alert('This note is too large to auto-save in the browser. Try using smaller images or fewer drawings.');
            }
        }
    }

    function debouncedSave() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(save, 300);
    }

    function getActive() {
        return state.notes.find(n => n.id === state.activeId) || null;
    }

    function sortNotes() {
        const s = state.sortBy || 'lastChange';
        if (s === 'ascending') {
            state.notes.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
        } else if (s === 'descending') {
            state.notes.sort((a, b) => (b.title || '').localeCompare(a.title || ''));
        } else {
            state.notes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        }
    }

    function render() {
        renderSidebar();
        renderEditor();
        updateHeaderSubtitle();
    }

    function renderSidebar() {
        sortNotes();
        const active = getActive();

        if (state.notes.length === 0) {
            notesList.innerHTML = '<div class="notes-empty">No notes yet. Create one!</div>';
            return;
        }

        let html = '';
        for (const note of state.notes) {
            const isActive = note.id === (active ? active.id : null);
            const title = note.title.trim() || 'Untitled';
            const previewText = note.content.replace(/[#*`>\[\]!|~_\-]/g, '').trim().slice(0, 60) || 'Empty note';
            const date = new Date(note.updatedAt);
            const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
            html += `
                <div class="note-item${isActive ? ' active' : ''}" data-id="${note.id}">
                    <div class="note-item-title">${escapeHtml(title)}</div>
                    <div class="note-item-preview">${escapeHtml(previewText)}</div>
                    <div class="note-item-date">${dateStr}</div>
                    <button class="note-delete" data-id="${note.id}" title="Delete note">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            `;
        }
        notesList.innerHTML = html;

        notesList.querySelectorAll('.note-item').forEach(el => {
            el.addEventListener('click', function (e) {
                if (e.target.closest('.note-delete')) return;
                const id = this.dataset.id;
                if (id !== state.activeId) {
                    state.activeId = id;
                    state.mobilePreview = false;
                    save();
                    render();
                    closeSidebar();
                }
            });
        });

        notesList.querySelectorAll('.note-delete').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                const id = this.dataset.id;
                deleteNote(id);
            });
        });
    }

    function renderEditor() {
        const active = getActive();

        if (!active) {
            emptyState.style.display = 'flex';
            noteContent.classList.remove('visible');
            return;
        }

        emptyState.style.display = 'none';
        noteContent.classList.add('visible');

        isProgrammaticChange = true;

        if (document.activeElement !== noteTitle) {
            noteTitle.value = active.title;
        }

        if (document.activeElement !== mdInput) {
            mdInput.value = active.content;
        }

        isProgrammaticChange = false;

        updatePreview();
        updateMobileTabs();
    }

    function transformRegexExpressions(content) {
        return content.replace(/(?<!\w)\/((?:[^\n\/\\]|\\.)+)\/[gimsuy]*/g, '`$&`');
    }

    function renderMathExpressions(content) {
        const blocks = [];

        content = content.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
            const id = `MATH_B_${blocks.length}`;
            blocks.push({ id, math: math.trim(), display: true });
            return id;
        });

        content = content.replace(/\$(?!\s)([^$]*?\S)\$/g, (_, math) => {
            const id = `MATH_I_${blocks.length}`;
            blocks.push({ id, math: math.trim(), display: false });
            return id;
        });

        content = transformRegexExpressions(content);

        let html = marked.parse(content);

        for (const { id, math, display } of blocks) {
            try {
                const rendered = katex.renderToString(math, {
                    displayMode: display,
                    throwOnError: false
                });
                html = html.replace(id, rendered);
            } catch (e) {
                html = html.replace(id, `<code>${escapeHtml(math)}</code>`);
            }
        }

        return html;
    }

    function updatePreview() {
        const active = getActive();
        if (!active) return;

        if (active.content.trim()) {
            const resolved = resolveAttachmentImages(active, active.content);
            preview.innerHTML = renderMathExpressions(resolved);
        } else {
            preview.innerHTML = '<p id="preview-empty">Nothing to preview</p>';
        }
    }

    function updateMobileTabs() {
        $$('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === (state.mobilePreview ? 'preview' : 'write'));
        });
        writePane.classList.toggle('mobile-hidden', state.mobilePreview);
        previewPane.classList.toggle('visible', state.mobilePreview);
    }

    function updateHeaderSubtitle() {
        const active = getActive();
        if (active) {
            const d = new Date(active.updatedAt);
            const s = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            headerSub.textContent = 'Last edit: ' + s;
        } else {
            headerSub.textContent = '';
        }
    }

    function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
    }

    function ensureAttachments(note) {
        if (!note.attachments || typeof note.attachments !== 'object' || Array.isArray(note.attachments)) {
            note.attachments = {};
        }
        return note.attachments;
    }

    function uniqueAttachmentLabel(note, name) {
        const attachments = ensureAttachments(note);
        const base = cleanImageAlt(name);
        let label = base;
        let count = 2;

        while (attachments[label]) {
            label = base + ' ' + count;
            count += 1;
        }

        return label;
    }

    function addAttachment(note, dataUrl, name) {
        const attachments = ensureAttachments(note);
        const label = uniqueAttachmentLabel(note, name);
        attachments[label] = {
            name: name || label,
            data: dataUrl,
            createdAt: new Date().toISOString()
        };
        return label;
    }

    function getAttachmentData(note, label) {
        const attachments = note && note.attachments ? note.attachments : {};
        const asset = attachments[label];

        if (typeof asset === 'string') {
            return asset;
        }

        return asset && asset.data ? asset.data : null;
    }

    function resolveAttachmentImages(note, content) {
        if (!note || !content) return content;

        return content.replace(/!\[([^\]\r\n]+)\](?!\()/g, (match, label) => {
            const dataUrl = getAttachmentData(note, label.trim());
            return dataUrl ? `![${cleanImageAlt(label)}](${dataUrl})` : match;
        });
    }

    function migrateLegacyImageData() {
        let changed = false;

        state.notes.forEach(note => {
            ensureAttachments(note);

            if (!note.content || !note.content.includes('data:image/')) {
                return;
            }

            note.content = note.content.replace(/!\[([^\]\r\n]*)\]\((data:image\/[^)\s]+)\)/g, (match, alt, dataUrl) => {
                const label = addAttachment(note, dataUrl, alt || 'image');
                changed = true;
                return `![${label}]`;
            });
        });

        return changed;
    }

    function addNote() {
        const note = {
            id: uid(),
            title: '',
            content: '',
            attachments: {},
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        state.notes.push(note);
        state.activeId = note.id;
        state.mobilePreview = false;
        save();
        render();
        closeSidebar();
        setTimeout(() => noteTitle.focus(), 50);
    }

    function deleteNote(id) {
        const note = state.notes.find(n => n.id === id);
        if (!note) return;
        const title = note.title.trim() || 'Untitled';
        if (!confirm(`Delete "${title}"?`)) return;

        state.notes = state.notes.filter(n => n.id !== id);
        if (state.activeId === id) {
            state.activeId = state.notes.length > 0 ? state.notes[0].id : null;
        }
        save();
        render();
    }

    function switchMobileMode(mode) {
        state.mobilePreview = mode === 'preview';
        updateMobileTabs();
    }

    /* Markdown insertion */
    function insertAround(before, after, placeholder) {
        const ta = mdInput;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const text = ta.value;
        const selected = text.substring(start, end) || placeholder;

        ta.value = text.slice(0, start) + before + selected + after + text.slice(end);
        ta.focus();
        const newPos = start + before.length + selected.length + after.length;
        ta.setSelectionRange(newPos, newPos);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function insertAtLine(prefix) {
        const ta = mdInput;
        const start = ta.selectionStart;
        const text = ta.value;
        const lineStart = text.lastIndexOf('\n', start - 1) + 1;
        ta.value = text.slice(0, lineStart) + prefix + text.slice(lineStart);
        ta.focus();
        const newPos = start + prefix.length;
        ta.setSelectionRange(newPos, newPos);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function insertFull(before, after, placeholder) {
        const ta = mdInput;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const text = ta.value;
        const selected = text.substring(start, end) || placeholder;

        ta.value = text.slice(0, start) + before + selected + after + text.slice(end);
        ta.focus();
        ta.setSelectionRange(start + before.length, start + before.length + selected.length);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function insertMarkdownText(markdown) {
        const ta = mdInput;
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        const text = ta.value;
        const before = start > 0 && text[start - 1] !== '\n' ? '\n' : '';
        const after = text[end] && text[end] !== '\n' ? '\n' : '';

        ta.value = text.slice(0, start) + before + markdown + after + text.slice(end);
        ta.focus();
        const pos = start + before.length + markdown.length + after.length;
        ta.setSelectionRange(pos, pos);
        ta.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function cleanImageAlt(name) {
        return (name || 'image')
            .replace(/\.[^.]+$/, '')
            .replace(/[\[\]\r\n]/g, ' ')
            .trim() || 'image';
    }

    function insertImageData(dataUrl, alt) {
        const active = getActive();
        if (!active) return;

        const label = addAttachment(active, dataUrl, alt);
        insertMarkdownText(`![${label}]\n`);
    }

    function resizeImageFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = reader.result;
                const img = new Image();
                img.onload = () => {
                    const maxSide = 1400;
                    const largestSide = Math.max(img.width, img.height);

                    if (largestSide <= maxSide && file.size <= 900 * 1024) {
                        resolve(dataUrl);
                        return;
                    }

                    const scale = Math.min(1, maxSide / largestSide);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.88));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function handleImageUpload() {
        const file = imageUpload.files && imageUpload.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('Please choose an image file.');
            imageUpload.value = '';
            return;
        }

        try {
            const dataUrl = await resizeImageFile(file);
            insertImageData(dataUrl, file.name);
        } catch (e) {
            alert('Could not add that image. Please try another file.');
        } finally {
            imageUpload.value = '';
        }
    }

    function setDrawingPanel(open) {
        drawingPanel.classList.toggle('open', open);
        drawingPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
        if (open) {
            setTimeout(resizeDrawingCanvas, 0);
        }
    }

    function resizeDrawingCanvas() {
        if (!drawingCanvas || !drawingPanel.classList.contains('open')) return;

        const wrap = $('#drawing-canvas-wrap');
        const rect = wrap.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const dpr = window.devicePixelRatio || 1;
        const previous = drawingCanvas.width && drawingCanvas.height ? drawingCanvas.toDataURL('image/png') : null;

        drawingCanvas.width = Math.round(rect.width * dpr);
        drawingCanvas.height = Math.round(rect.height * dpr);
        drawingCanvas.style.width = rect.width + 'px';
        drawingCanvas.style.height = rect.height + 'px';

        drawingCtx = drawingCanvas.getContext('2d');
        drawingCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        drawingCtx.lineCap = 'round';
        drawingCtx.lineJoin = 'round';
        drawingCtx.fillStyle = '#ffffff';
        drawingCtx.fillRect(0, 0, rect.width, rect.height);

        if (previous && drawingHasMarks) {
            const img = new Image();
            img.onload = () => drawingCtx.drawImage(img, 0, 0, rect.width, rect.height);
            img.src = previous;
        }
    }

    function pointerPosition(e) {
        const rect = drawingCanvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }

    function startDrawing(e) {
        if (!drawingCtx) resizeDrawingCanvas();
        const pos = pointerPosition(e);
        drawingActive = true;
        drawingPointerId = e.pointerId;
        drawingHasMarks = true;
        drawingCanvas.setPointerCapture(e.pointerId);
        drawingCtx.beginPath();
        drawingCtx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function draw(e) {
        if (!drawingActive || e.pointerId !== drawingPointerId || !drawingCtx) return;
        const pos = pointerPosition(e);
        const size = Number(drawSize.value);
        drawingCtx.strokeStyle = drawingMode === 'eraser' ? '#ffffff' : drawColor.value;
        drawingCtx.lineWidth = drawingMode === 'eraser' ? Math.max(8, size * 2) : size;
        drawingCtx.lineTo(pos.x, pos.y);
        drawingCtx.stroke();
        e.preventDefault();
    }

    function stopDrawing(e) {
        if (!drawingActive || e.pointerId !== drawingPointerId) return;
        drawingActive = false;
        drawingPointerId = null;
        drawingCtx.closePath();
        e.preventDefault();
    }

    function clearDrawing() {
        if (!drawingCtx) resizeDrawingCanvas();
        const rect = drawingCanvas.getBoundingClientRect();
        drawingCtx.fillStyle = '#ffffff';
        drawingCtx.fillRect(0, 0, rect.width, rect.height);
        drawingHasMarks = false;
    }

    function setDrawingMode(mode) {
        drawingMode = mode === 'eraser' ? 'eraser' : 'pen';
        const erasing = drawingMode === 'eraser';
        drawEraser.classList.toggle('active', erasing);
        drawEraser.setAttribute('aria-pressed', erasing ? 'true' : 'false');
        drawingCanvas.style.cursor = erasing ? 'cell' : 'crosshair';
    }

    function insertDrawing() {
        if (!drawingHasMarks) {
            alert('Draw something first.');
            return;
        }

        insertImageData(drawingCanvas.toDataURL('image/png'), 'drawing');
        setDrawingPanel(false);
    }

    const commands = {
        bold: () => insertAround('**', '**', 'bold text'),
        italic: () => insertAround('*', '*', 'italic text'),
        strikethrough: () => insertAround('~~', '~~', 'strikethrough'),
        h1: () => insertAtLine('# '),
        h2: () => insertAtLine('## '),
        h3: () => insertAtLine('### '),
        ul: () => insertAtLine('- '),
        ol: () => insertAtLine('1. '),
        quote: () => insertAtLine('> '),
        code: () => insertAround('```\n', '\n```', 'code block'),
        link: () => insertFull('[', '](url)', 'link text'),
        hr: () => {
            const ta = mdInput;
            const pos = ta.selectionStart;
            const text = ta.value;
            ta.value = text.slice(0, pos) + '\n---\n' + text.slice(pos);
            ta.focus();
            ta.setSelectionRange(pos + 5, pos + 5);
            ta.dispatchEvent(new Event('input', { bubbles: true }));
        },
        image: () => imageUpload.click(),
        draw: () => setDrawingPanel(!drawingPanel.classList.contains('open'))
    };

    function safeFileName(name) {
        return (name || 'Untitled').replace(/[\\/:*?"<>|]/g, '-').trim() || 'Untitled';
    }

    function waitForExportImages(root) {
        const images = Array.from(root.querySelectorAll('img'));

        return Promise.all(images.map(img => {
            if (img.complete) {
                return Promise.resolve();
            }

            return new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
            });
        }));
    }

    async function exportPDF() {
        const active = getActive();
        if (!active) return;

        if (typeof html2pdf !== 'function') {
            alert('PDF export is still loading. Please check your internet connection and try again.');
            return;
        }

        const title = active.title.trim() || 'Untitled';
        const content = resolveAttachmentImages(active, active.content).trim() || '*Empty note*';

        const el = document.createElement('div');
        el.style.cssText = 'padding:40px;font-family:"Source Serif 4",serif;color:#20242A;line-height:1.7;background:#FFFFFF;';
        el.innerHTML = `
            <h1 style="font-family:'Source Serif 4',serif;font-size:24px;font-weight:600;margin-bottom:8px;color:#16324F;">${escapeHtml(title)}</h1>
            <hr style="border:none;border-top:1px solid #DEDAD0;margin-bottom:20px;">
            <div style="font-size:14px;">${marked.parse(content)}</div>
        `;

        el.querySelectorAll('div h1, div h2, div h3, div h4').forEach(h => {
            h.style.cssText = 'font-family:"Source Serif 4",serif;font-weight:700;color:#16324F;line-height:1.3;margin-top:18px;margin-bottom:8px;';
        });
        el.querySelectorAll('div h1').forEach(h => {
            h.style.borderBottom = '1px solid #DEDAD0';
            h.style.paddingBottom = '6px';
        });
        el.querySelectorAll('table').forEach(t => {
            t.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:16px;';
            t.querySelectorAll('th, td').forEach(c => {
                c.style.cssText = 'padding:8px 12px;border:1px solid #DEDAD0;text-align:left;font-size:13px;';
            });
            t.querySelectorAll('th').forEach(c => {
                c.style.background = '#EFEDE7';
                c.style.fontWeight = '600';
            });
        });
        el.querySelectorAll('pre').forEach(p => {
            p.style.cssText = 'background:#1E232B;color:#EAEAEA;padding:14px;border-radius:10px;border:1px solid #1E232B;overflow-x:auto;font-size:12px;margin-bottom:16px;';
        });
        el.querySelectorAll('code:not(pre code)').forEach(c => {
            c.style.cssText = 'background:#EFEDE7;color:#20242A;padding:2px 5px;border-radius:6px;font-size:0.875em;font-family:"JetBrains Mono",monospace;';
        });
        el.querySelectorAll('pre code').forEach(c => {
            c.style.cssText = 'background:transparent;color:#EAEAEA;font-family:"JetBrains Mono",monospace;';
        });
        el.querySelectorAll('blockquote').forEach(b => {
            b.style.cssText = 'border-left:3px solid #AD8A4E;padding:6px 14px;margin-bottom:16px;background:#EFEDE7;color:#5B6169;font-style:italic;';
        });
        el.querySelectorAll('img').forEach(img => {
            img.style.cssText = 'max-width:100%;border-radius:6px;';
        });

        document.body.appendChild(el);

        try {
            if (document.fonts && document.fonts.ready) {
                await document.fonts.ready;
            }
            await waitForExportImages(el);

            await html2pdf().set({
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: safeFileName(title) + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    letterRendering: true
                },
                jsPDF: {
                    unit: 'in',
                    format: 'a4',
                    orientation: 'portrait'
                }
            }).from(el).save();
        } catch (e) {
            alert('Failed to generate PDF. Please try again.');
        } finally {
            if (el.parentNode) {
                document.body.removeChild(el);
            }
        }
    }

    function downloadMD() {
        const active = getActive();
        if (!active) return;

        const title = active.title.trim() || 'untitled';
        const content = resolveAttachmentImages(active, active.content);
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title + '.md';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
    }

    /* Event listeners */
    themeBtn.addEventListener('click', toggleTheme);

    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        sidebar.classList.toggle('collapsed');
        overlay.classList.toggle('open');
    });

    overlay.addEventListener('click', closeSidebar);

    $('#add-note').addEventListener('click', addNote);

    const sortSelect = $('#sort-select');
    sortSelect.addEventListener('change', function () {
        state.sortBy = this.value;
        save();
        renderSidebar();
    });

    toolbar.addEventListener('click', function (e) {
        const btn = e.target.closest('.toolbar-btn');
        if (!btn) return;
        const cmd = btn.dataset.cmd;
        if (cmd && commands[cmd]) {
            e.preventDefault();
            commands[cmd]();
            if (cmd !== 'image' && cmd !== 'draw') {
                mdInput.focus();
            }
        }
    });

    imageUpload.addEventListener('change', handleImageUpload);

    openMdBtn.addEventListener('click', () => openMdInput.click());

    openMdInput.addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
            const content = e.target.result;
            const name = file.name.replace(/\.(md|markdown)$/i, '').trim() || 'Untitled';

            const note = {
                id: uid(),
                title: name,
                content: content,
                attachments: {},
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            state.notes.push(note);
            state.activeId = note.id;
            state.mobilePreview = false;
            save();
            render();
            closeSidebar();
            setTimeout(() => noteTitle.focus(), 50);
        };
        reader.onerror = function () {
            alert('Could not read the file. Please try again.');
        };
        reader.readAsText(file);

        this.value = '';
    });

    drawingCanvas.addEventListener('pointerdown', startDrawing);
    drawingCanvas.addEventListener('pointermove', draw);
    drawingCanvas.addEventListener('pointerup', stopDrawing);
    drawingCanvas.addEventListener('pointercancel', stopDrawing);
    drawEraser.addEventListener('click', () => setDrawingMode(drawingMode === 'eraser' ? 'pen' : 'eraser'));
    drawClear.addEventListener('click', clearDrawing);
    drawInsert.addEventListener('click', insertDrawing);
    drawClose.addEventListener('click', () => setDrawingPanel(false));

    $$('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function () {
            switchMobileMode(this.dataset.mode);
        });
    });

    noteTitle.addEventListener('input', function () {
        if (isProgrammaticChange) return;
        const active = getActive();
        if (!active) return;
        active.title = this.value;
        active.updatedAt = new Date().toISOString();
        debouncedSave();
        renderSidebar();
        updateHeaderSubtitle();
    });

    mdInput.addEventListener('input', function () {
        if (isProgrammaticChange) return;
        const active = getActive();
        if (!active) return;
        active.content = this.value;
        active.updatedAt = new Date().toISOString();
        debouncedSave();
        updateHeaderSubtitle();
        updatePreview();
    });

    $('#export-pdf').addEventListener('click', exportPDF);
    $('#download-md').addEventListener('click', downloadMD);

    /* Keyboard shortcuts */
    document.addEventListener('keydown', function (e) {
        const ctrl = e.ctrlKey || e.metaKey;
        if (ctrl && e.key === 'n') {
            e.preventDefault();
            addNote();
            return;
        }
        if (ctrl && e.key === 'b') {
            e.preventDefault();
            commands.bold();
            return;
        }
        if (ctrl && e.key === 'i') {
            e.preventDefault();
            commands.italic();
            return;
        }
    });

    /* Init */
    setTheme(currentTheme(), false);
    setDrawingMode('pen');
    load();
    sortSelect.value = state.sortBy;
    state.mobilePreview = false;
    render();

    if (getActive()) {
        updatePreview();
    }

    /* Handle window resize */
    let resizeTimer;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (!mobileLayout.matches) {
                closeSidebar();
            }
            if (drawingPanel.classList.contains('open')) {
                resizeDrawingCanvas();
            }
        }, 150);
    });

})();
</script>
</body>
